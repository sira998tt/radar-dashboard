<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMD Radar Status Dashboard</title>
    <style>
        /* 🎨 ตั้งค่าตัวแปรสีสำหรับ Light / Dark Mode */
        :root {
            --bg-color: #f4f6f9;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --card-bg: #ffffff;
            --card-shadow: rgba(0,0,0,0.05);
            --card-shadow-hover: rgba(0,0,0,0.1);
            --border-default: #3498db;
            --pill-bg: #ffffff;
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --text-muted: #aaaaaa;
            --card-bg: #1e1e1e;
            --card-shadow: rgba(0,0,0,0.4);
            --card-shadow-hover: rgba(0,0,0,0.6);
            --border-default: #2980b9;
            --pill-bg: #2a2a2a;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            margin: 0; 
            padding: 30px; 
            color: var(--text-main);
            transition: background-color 0.3s, color 0.3s;
        }

        /* 🌙 ปุ่มสลับโหมดมืด */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: none;
            font-size: 24px;
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 50%;
            box-shadow: 0 2px 5px var(--card-shadow);
            transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.1); }

        h2 { text-align: center; margin-bottom: 5px; }
        .update-time { text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 14px; }
        
        /* 📊 ป้ายสรุปด้านบน (Summary Pills) */
        .summary-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-width: 1200px;
            margin: 0 auto 30px auto;
        }
        .summary-pill {
            background-color: var(--pill-bg);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 3px 6px var(--card-shadow);
            border-left: 5px solid #2ecc71; /* สีเขียวเริ่มต้น */
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .summary-pill.error { border-left-color: #e74c3c; }

        /* 🗂️ Grid การ์ดสถานี */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .card { 
            background: var(--card-bg); 
            border-radius: 12px; 
            padding: 20px; 
            box-shadow: 0 4px 6px var(--card-shadow); 
            text-align: center; 
            transition: transform 0.2s, box-shadow 0.2s; 
            border-top: 4px solid var(--border-default); 
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 12px var(--card-shadow-hover); }
        .card.offline-card { border-top: 4px solid #e74c3c; }
        
        .status-dot { height: 16px; width: 16px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: -2px; }
        .online { background-color: #2ecc71; box-shadow: 0 0 10px #2ecc71; }
        .offline { background-color: #e74c3c; box-shadow: 0 0 10px #e74c3c; animation: blink 1s infinite; }
        
        .st-name { font-size: 20px; font-weight: bold; margin: 15px 0 10px; color: var(--text-main); }
        .st-link { text-decoration: none; color: #fff; background-color: #3498db; padding: 8px 15px; border-radius: 20px; font-size: 13px; display: inline-block; transition: background 0.2s; }
        .st-link:hover { background-color: #2980b9; }
        .status-text { color: var(--text-muted); font-size: 14px; font-weight: 500; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* จัดการหน้าจอมือถือ */
        @media (max-width: 600px) {
            h2 { font-size: 20px; margin-top: 25px; }
            .theme-toggle { top: 10px; right: 10px; font-size: 20px; }
        }
    </style>
</head>
<body>

    <button class="theme-toggle" id="themeToggle" title="สลับโหมดสว่าง/มืด">🌙</button>

    <h2>📡 Dashboard ระบบติดตามเรดาร์ตรวจอากาศ</h2>
    <div class="update-time" id="lastUpdate">กำลังเชื่อมต่อข้อมูลล่าสุด...</div>
    
    <!-- พื้นที่แสดงป้ายสรุป -->
    <div class="summary-container" id="summaryContainer"></div>
    
    <!-- พื้นที่แสดงการ์ด -->
    <div class="grid" id="dashboard"></div>

    <script>
        // -----------------------------------------
        // 🌙 ระบบสลับ Dark / Light Mode
        // -----------------------------------------
        const toggleBtn = document.getElementById('themeToggle');
        // ตรวจสอบค่าเดิมที่เคยบันทึกไว้ใน Browser
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
            toggleBtn.innerText = '☀️';
        }

        toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
                toggleBtn.innerText = '☀️';
            } else {
                localStorage.setItem('theme', 'light');
                toggleBtn.innerText = '🌙';
            }
        });

        // -----------------------------------------
        // 📡 ระบบดึงข้อมูลและแสดงผล
        // -----------------------------------------
        function fetchData() {
            fetch('data.json?t=' + new Date().getTime())
                .then(response => response.json())
                .then(data => {
                    document.getElementById('lastUpdate').innerText = '🔄 สแกนหน้าเว็บล่าสุด: ' + data.last_update;
                    
                    const dashboard = document.getElementById('dashboard');
                    const summaryContainer = document.getElementById('summaryContainer');
                    dashboard.innerHTML = ''; 
                    summaryContainer.innerHTML = '';

                    // Object สำหรับเก็บยอดสรุปแต่ละกลุ่ม
                    const groups = {};

                    // วนลูปสร้างการ์ด และเก็บสถิติ
                    data.stations.forEach(st => {
                        // แยกชื่อเพื่อจัดกลุ่ม (เช่น "สทิงพระ (HQ)" -> เอาแค่ "สทิงพระ")
                        const baseName = st.name.split(' ')[0];
                        if (!groups[baseName]) {
                            groups[baseName] = { total: 0, offline: 0 };
                        }
                        groups[baseName].total += 1;
                        
                        const isOnline = st.status === 'online';
                        if (!isOnline) groups[baseName].offline += 1;

                        const statusClass = isOnline ? 'online' : 'offline';
                        const cardClass = isOnline ? '' : 'offline-card';
                        const statusText = isOnline ? 'อัปเดตปกติ' : 'ภาพค้าง / ขาดการติดต่อ';
                        
                        const card = document.createElement('div');
                        card.className = `card ${cardClass}`;
                        card.innerHTML = `
                            <div>
                                <span class="status-dot ${statusClass}"></span>
                                <span class="status-text">${statusText}</span>
                            </div>
                            <div class="st-name">${st.name}</div>
                            <a href="${st.url}" target="_blank" class="st-link">🔍 ดูภาพเรดาร์ต้นฉบับ</a>
                        `;
                        dashboard.appendChild(card);
                    });

                    // วนลูปสร้างป้ายสรุป (Summary Pills) ด้านบน
                    for (const [name, stats] of Object.entries(groups)) {
                        const pill = document.createElement('div');
                        const hasError = stats.offline > 0;
                        pill.className = `summary-pill ${hasError ? 'error' : ''}`;
                        
                        if (hasError) {
                            pill.innerHTML = `🔴 ${name} (${stats.total - stats.offline}/${stats.total})`;
                        } else {
                            pill.innerHTML = `🟢 ${name} (${stats.total}/${stats.total})`;
                        }
                        summaryContainer.appendChild(pill);
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    document.getElementById('lastUpdate').innerText = '⚠️ รอระบบส่วนหลังบ้านอัปเดตข้อมูลขึ้นเซิร์ฟเวอร์...';
                });
        }

        // ดึงครั้งแรกและตั้งเวลาอัตโนมัติให้หน้าเว็บดึงใหม่ทุก 3 นาที (180,000 ms)
        fetchData();
        setInterval(fetchData, 180000);
    </script>

</body>
</html>
